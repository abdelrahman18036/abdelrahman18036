<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 54" width="1000" height="54" role="img" aria-label="Nine products, shipped end-to-end — design, build, deploy, solo. Explore them live at abdorange.me">
  <style>
    @keyframes glide { 0%{transform:translateX(0);opacity:0;} 12%{opacity:1;} 88%{opacity:1;} 100%{transform:translateX(560px);opacity:0;} }
    @keyframes blink { 0%,45%{opacity:1;} 55%,100%{opacity:0.25;} }
    .node { animation:glide 5s ease-in-out infinite; }
    .play { animation:blink 2.6s ease-in-out infinite; }
  </style>

  <!-- seamless GitHub-dark canvas -->
  <rect width="100%" height="100%" fill="#0d1117"/>

  <!-- HUD corner ticks -->
  <g stroke="#FF6B00" stroke-width="1.3" fill="none" opacity="0.8">
    <path d="M18 16 L18 10 L24 10"/>
    <path d="M982 16 L982 10 L976 10"/>
    <path d="M18 44 L18 50 L24 50"/>
    <path d="M982 44 L982 50 L976 50"/>
  </g>

  <!-- left: fire hex bullet + caption -->
  <g transform="translate(40,27)">
    <path d="M0 -6 L5.2 -3 L5.2 3 L0 6 L-5.2 3 L-5.2 -3 Z" fill="#FF6B00"/>
  </g>
  <text x="56" y="31" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" letter-spacing="0.16em" fill="#9C9C9C">NINE PRODUCTS · END-TO-END — DESIGN <tspan fill="#FF6B00">→</tspan> BUILD <tspan fill="#FF6B00">→</tspan> DEPLOY · SOLO</text>

  <!-- underline + traveling node -->
  <g transform="translate(56,40)">
    <line x1="0" y1="0" x2="560" y2="0" stroke="#1A1A1A" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="560" y2="0" stroke="#FF6B00" stroke-width="0.8" opacity="0.35"/>
    <g class="node">
      <circle cx="0" cy="0" r="5" fill="#FF6B00" opacity="0.22"/>
      <circle cx="0" cy="0" r="2" fill="#FF8A00"/>
    </g>
  </g>

  <!-- right: fire CTA chip -->
  <g transform="translate(858,27)">
    <rect x="-118" y="-14" width="236" height="28" rx="14" fill="#0d1117" stroke="#FF6B00" stroke-width="1.2"/>
    <rect x="-118" y="-14" width="236" height="28" rx="14" fill="#FF6B00" opacity="0.06"/>
    <path class="play" d="M-100 -4 L-100 4 L-93 0 Z" fill="#FF6B00"/>
    <text x="-86" y="3" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" letter-spacing="0.08em" fill="#FAFAFA">EXPLORE THEM LIVE · </text>
    <text x="42" y="3" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" letter-spacing="0.08em" fill="#FF6B00" font-weight="700">abdorange.me</text>
  </g>
</svg>
