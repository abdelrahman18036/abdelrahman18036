  <!-- Twinkling hexes (filled, staggered) -->
  <g fill="#FF6B00" stroke="none">
    <polygon class="tw1" points="608,53 634,68 634,98 608,113 582,98 582,68" opacity="0.15"/>
    <polygon class="tw2" points="920,143 946,158 946,188 920,203 894,188 894,158" opacity="0.15"/>
    <polygon class="tw3" points="322,188 348,203 348,233 322,248 296,233 296,203" opacity="0.15"/>
    <polygon class="tw4" points="790,8 816,23 816,53 790,68 764,53 764,23" opacity="0.15"/>
  </g>

  <!-- TOP HUD STRIP -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="11" letter-spacing="0.18em">
    <text x="40" y="40" fill="#9C9C9C">SUBJECT.01 // ABDELRAHMAN.A · SOFTWARE ENGINEER</text>
    <g>
      <circle class="statusDot" cx="861" cy="36" r="3.5" fill="#FF6B00" filter="url(#softGlow)"/>
      <text x="874" y="40" fill="#9C9C9C">OPEN TO WORK</text>
      <text x="1004" y="40" fill="#2A2A2A">|</text>
      <text x="1020" y="40" fill="#9C9C9C">LOCK ACQUIRED</text>
    </g>
  </g>
  <!-- Thin fire underline under strip -->
  <line x1="40" y1="52" x2="1160" y2="52" stroke="#FF6B00" stroke-width="1" opacity="0.35"/>

  <!-- CENTER-LEFT WORDMARK -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="-0.03em">
    <text x="38" y="188" font-size="84">
      <tspan fill="#FAFAFA">abd</tspan><tspan fill="url(#fireText)">orange</tspan>
    </text>
  </g>
  <!-- Tagline + block cursor -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="14" letter-spacing="0.28em">
    <text x="42" y="224" fill="#9C9C9C">FORGING THE HEXTECH WORLD</text>
    <rect class="cursor" x="392" y="212" width="11" height="16" fill="#FF6B00"/>
  </g>

  <!-- RIGHT: particle ORANGE cross-section -->
  <g transform="translate(1035 160)">
    <!-- rind glow breathing -->
    <circle class="rindBreathe" cx="0" cy="0" r="82" fill="url(#rindGrad)" transform="translate(0 0)"/>

    <!-- Reticle hex ring, spinning opposite -->
    <g>
      <polygon points="0,-92 80,-46 80,46 0,92 -80,46 -80,-46"
               fill="none" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.35"
               stroke-dasharray="6 10">
        <animateTransform attributeName="transform" type="rotate"
                          from="0 0 0" to="-360 0 0" dur="60s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Rotating orange -->
    <g filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="44s" repeatCount="indefinite"/>
      <!-- outer rind ring -->
      <circle cx="0" cy="0" r="72" fill="none" stroke="#FF8A00" stroke-width="2.5" stroke-opacity="0.9"/>
      <circle cx="0" cy="0" r="64" fill="none" stroke="#FF6B00" stroke-width="1.2" stroke-opacity="0.5"/>
      <!-- 8 radial wedge lines converging to center -->
      <g stroke="#FF6B00" stroke-width="1.4" stroke-opacity="0.75">
        <line x1="0" y1="0" x2="0"   y2="-64"/>
        <line x1="0" y1="0" x2="45"  y2="-45"/>
        <line x1="0" y1="0" x2="64"  y2="0"/>
        <line x1="0" y1="0" x2="45"  y2="45"/>
        <line x1="0" y1="0" x2="0"   y2="64"/>
        <line x1="0" y1="0" x2="-45" y2="45"/>
        <line x1="0" y1="0" x2="-64" y2="0"/>
        <line x1="0" y1="0" x2="-45" y2="-45"/>
      </g>
      <!-- seeds -->
      <g fill="#FF8A00" fill-opacity="0.85">
        <ellipse cx="0"   cy="-34" rx="3.4" ry="6" transform="rotate(0 0 -34)"/>
        <ellipse cx="30"  cy="-20" rx="3.4" ry="6" transform="rotate(56 30 -20)"/>
        <ellipse cx="34"  cy="14"  rx="3.4" ry="6" transform="rotate(112 34 14)"/>
        <ellipse cx="10"  cy="34"  rx="3.4" ry="6" transform="rotate(168 10 34)"/>
        <ellipse cx="-26" cy="26"  rx="3.4" ry="6" transform="rotate(224 -26 26)"/>
        <ellipse cx="-34" cy="-8"  rx="3.4" ry="6" transform="rotate(280 -34 -8)"/>
      </g>
      <!-- center pip -->
      <circle cx="0" cy="0" r="5" fill="#FF8A00"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.6"/>
    </g>
  </g>

  <!-- BOTTOM HUD: coordinate readout -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="11" letter-spacing="0.18em">
    <text x="40" y="292" fill="#9C9C9C">CAIRO, EGYPT · 30.0444°N  31.2357°E</text>
  </g>

  <!-- Sweeping scan line -->
  <rect x="0" y="0" width="240" height="320" fill="url(#scanGrad)" opacity="0.5">
    <animate attributeName="x" from="-240" to="1200" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD CORNER TICKS (L-brackets) -->
  <g stroke="#FF6B00" stroke-width="2" fill="none">
    <path d="M20,32 L20,20 L32,20"/>
    <path d="M1180,32 L1180,20 L1168,20"/>
    <path d="M20,288 L20,300 L32,300"/>
    <path d="M1180,288 L1180,300 L1168,300"/>
  </g>
</svg>
