<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="abd·orange — Abdelrahman Abdelnasser, Software Engineer. Forging the Hextech World.">
  <title>abd·orange — Forging the Hextech World</title>

  <defs>
    <!-- Fire glow bleeding from upper-right -->
    <radialGradient id="fireGlow" cx="82%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#FF4500" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Wordmark fire gradient -->
    <linearGradient id="fireText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>

    <!-- Scan line gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF6B00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </linearGradient>

    <!-- Orange rind gradient -->
    <radialGradient id="rindGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="72%" stop-color="#FF4500" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0.14"/>
    </radialGradient>

    <!-- Soft glow filter (defined once, reused) -->
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- One hexagon (pointy-top), reused across the grid -->
    <g id="hex">
      <polygon points="26,0 52,15 52,45 26,60 0,45 0,15" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    </g>

    <style>
      @keyframes cursorBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes dotBlink   { 0%,60% { opacity: 1; } 61%,100% { opacity: 0.15; } }
      @keyframes twk        { 0%,100% { opacity: 0.15; } 50% { opacity: 0.6; } }
      @keyframes breathe    { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
      .cursor { animation: cursorBlink 1.1s steps(1) infinite; }
      .statusDot { animation: dotBlink 1.6s ease-in-out infinite; }
      .tw1 { animation: twk 4.5s ease-in-out infinite; }
      .tw2 { animation: twk 5.5s ease-in-out infinite 1.2s; }
      .tw3 { animation: twk 6s ease-in-out infinite 2.4s; }
      .tw4 { animation: twk 5s ease-in-out infinite 0.6s; }
      .rindBreathe { animation: breathe 3s ease-in-out infinite; transform-origin: 1035px 160px; }
    </style>
  </defs>

  <!-- VOID background -->
  <rect width="100%" height="100%" fill="#0d1117"/>

  <!-- Fire glow upper-right -->
  <rect width="100%" height="100%" fill="url(#fireGlow)"/>

  <!-- Faint hex grid -->
  <g opacity="0.15">
    <use href="#hex" x="10"  y="8"/>
    <use href="#hex" x="62"  y="8"/>
    <use href="#hex" x="114" y="8"/>
    <use href="#hex" x="166" y="8"/>
