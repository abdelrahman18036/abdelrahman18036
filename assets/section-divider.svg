<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" role="img" aria-label="abd·orange section divider — a glowing hex node traveling along a fire line">
  <defs>
    <style>
      .tick { fill: #9C9C9C; opacity: 0.18; }
      @keyframes tickPulse { 0%,100% { opacity: 0.10; } 50% { opacity: 0.30; } }
      .tk { animation: tickPulse 4s ease-in-out infinite; }
    </style>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FF6B00" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#FF6B00" stop-opacity="0.55"/>
      <stop offset="0.5"  stop-color="#FF8A00" stop-opacity="0.9"/>
      <stop offset="0.85" stop-color="#FF6B00" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#FF6B00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="trail" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FF8A00" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#FF6B00" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#FF4500" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="hex">
      <polygon points="0,-5.2 4.5,-2.6 4.5,2.6 0,5.2 -4.5,2.6 -4.5,-2.6" fill="#FF6B00" stroke="#FF8A00" stroke-width="0.8"/>
      <polygon points="0,-2.4 2.1,-1.2 2.1,1.2 0,2.4 -2.1,1.2 -2.1,-1.2" fill="#FAFAFA" opacity="0.9"/>
    </g>
  </defs>

  <!-- Baked void background -->
  <rect width="100%" height="100%" fill="#0d1117"/>

  <!-- Central fire line -->
  <rect x="0" y="13.4" width="1000" height="1.2" fill="url(#line)"/>

  <!-- Faint tick marks along the line -->
  <g>
    <rect class="tick tk" x="120" y="9"  width="1" height="10" style="animation-delay:0s"/>
    <rect class="tick tk" x="260" y="10" width="1" height="8"  style="animation-delay:0.6s"/>
    <rect class="tick tk" x="400" y="9"  width="1" height="10" style="animation-delay:1.2s"/>
    <rect class="tick tk" x="500" y="8"  width="1" height="12" style="animation-delay:1.8s"/>
    <rect class="tick tk" x="600" y="9"  width="1" height="10" style="animation-delay:2.4s"/>
    <rect class="tick tk" x="740" y="10" width="1" height="8"  style="animation-delay:3.0s"/>
    <rect class="tick tk" x="880" y="9"  width="1" height="10" style="animation-delay:3.6s"/>
  </g>

  <!-- Trailing glow following the node -->
  <ellipse cx="0" cy="14" rx="34" ry="7" fill="url(#trail)">
    <animateTransform attributeName="transform" type="translate"
      values="-40,0; 1040,0" dur="5s" repeatCount="indefinite"
      keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.08;0.92;1" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Traveling hex node -->
  <g filter="url(#glow)">
    <use href="#hex" x="0" y="14">
      <animateMotion path="M -40 0 L 1040 0" dur="5s" repeatCount="indefinite" calcMode="linear"/>
    </use>
    <use href="#hex" x="0" y="14" opacity="0.9">
      <animateMotion path="M -40 0 L 1040 0" dur="5s" repeatCount="indefinite" calcMode="linear"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- Soft core pulse traveling with node -->
  <circle cx="0" cy="14" r="2" fill="#FAFAFA">
    <animateMotion path="M -40 0 L 1040 0" dur="5s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
