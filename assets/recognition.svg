<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Recognition — 18 records verified and cross-referenced. Award list including Huawei ICT Global Grand Prize and 1st Prize, IEEE publication, Top 50 Coders in the Arab World, MWC Barcelona, and graduation with honours.">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Courier New',monospace; }
      .disp { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .tick { opacity: 0; animation: blink 5s linear infinite; }
      .r0 { animation-delay: 0.4s; }
      .r1 { animation-delay: 1.0s; }
      .r2 { animation-delay: 1.6s; }
      .r3 { animation-delay: 2.2s; }
      .r4 { animation-delay: 2.8s; }
      .r5 { animation-delay: 3.4s; }
      @keyframes blink {
        0% { opacity: 0; }
        6% { opacity: 1; }
        70% { opacity: 1; }
        84% { opacity: 0.35; }
        100% { opacity: 0; }
      }
      .statdot { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse {
        0%,100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
    </style>
    <linearGradient id="fireGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A00"/>
      <stop offset="1" stop-color="#FF4500"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF6B00" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Seamless GitHub-dark canvas -->
  <rect width="100%" height="100%" fill="#0d1117"/>

  <!-- Background constellation of node dots -->
  <g stroke="#FF6B00" stroke-opacity="0.10" stroke-width="1">
    <line x1="120" y1="70" x2="240" y2="120"/>
    <line x1="240" y1="120" x2="180" y2="230"/>
    <line x1="180" y1="230" x2="90" y2="300"/>
    <line x1="240" y1="120" x2="330" y2="80"/>
    <line x1="820" y1="60" x2="910" y2="140"/>
    <line x1="910" y1="140" x2="840" y2="250"/>
    <line x1="840" y1="250" x2="930" y2="340"/>
    <line x1="820" y1="60" x2="720" y2="110"/>
    <line x1="180" y1="230" x2="90" y2="150"/>
  </g>
  <g fill="#FF6B00" fill-opacity="0.22">
    <circle cx="120" cy="70" r="2"/>
    <circle cx="240" cy="120" r="2.5"/>
    <circle cx="180" cy="230" r="2"/>
    <circle cx="90" cy="300" r="2"/>
    <circle cx="330" cy="80" r="2"/>
    <circle cx="90" cy="150" r="1.6"/>
    <circle cx="820" cy="60" r="2.5"/>
    <circle cx="910" cy="140" r="2"/>
    <circle cx="840" cy="250" r="2"/>
    <circle cx="930" cy="340" r="2"/>
    <circle cx="720" cy="110" r="1.6"/>
  </g>

  <!-- HUD corner ticks -->
  <g stroke="#FF6B00" stroke-width="1.5" fill="none" stroke-opacity="0.8">
    <path d="M20 34 L20 20 L34 20"/>
    <path d="M980 34 L980 20 L966 20"/>
    <path d="M20 396 L20 410 L34 410"/>
    <path d="M980 396 L980 410 L966 410"/>
  </g>

  <!-- Section code -->
  <text x="42" y="52" class="mono" font-size="12" letter-spacing="0.22em" fill="#9C9C9C">05 ·  RECOGNITION</text>
  <g>
    <circle cx="958" cy="47" r="3.5" fill="#FF6B00" class="statdot"/>
    <text x="946" y="51" text-anchor="end" class="mono" font-size="11" letter-spacing="0.16em" fill="#5C6670">PROOF</text>
  </g>

  <!-- Big fire "18" block -->
  <text x="42" y="150" class="disp" font-size="82" font-weight="800" letter-spacing="-0.02em" fill="url(#fireGrad)">18</text>
  <text x="150" y="118" class="mono" font-size="15" letter-spacing="0.20em" fill="#FAFAFA">RECORDS</text>
  <text x="150" y="140" class="mono" font-size="15" letter-spacing="0.20em" fill="#FF6B00">VERIFIED</text>
  <text x="42" y="182" class="mono" font-size="10.5" letter-spacing="0.16em" fill="#9C9C9C">ALL RECORDS VERIFIED · CROSS-REFERENCED</text>

  <!-- Divider rule under header -->
  <line x1="42" y1="200" x2="958" y2="200" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Coordinate readout -->
  <text x="958" y="150" text-anchor="end" class="mono" font-size="10" letter-spacing="0.14em" fill="#5C6670">CAIRO · 30.0444°N 31.2357°E</text>

  <!-- ===== AWARD LIST ===== -->
  <!-- Row geometry: rows start y=228, step 34 -->
  <g class="mono">
    <!-- Row 0 -->
    <g transform="translate(0,228)">
      <path d="M54 -4 l7 4 l0 8 l-7 4 l-7 -4 l0 -8 z" fill="url(#fireGrad)"/>
      <text x="78" y="1" class="disp" font-size="14.5" font-weight="800" fill="#FAFAFA">GRAND PRIZE <tspan class="mono" font-size="11" font-weight="400" fill="#9C9C9C">(Team Instructor)  ·  Huawei ICT Global, Shenzhen</tspan></text>
      <text x="900" y="1" text-anchor="end" font-size="13" letter-spacing="0.08em" fill="#FF6B00">2026</text>
      <g class="tick r0">
        <text x="912" y="1" font-size="10" letter-spacing="0.06em" fill="#FF6B00">✓ VERIFIED</text>
      </g>
    </g>
    <!-- Row 1 -->
    <g transform="translate(0,262)">
      <path d="M54 -4 l7 4 l0 8 l-7 4 l-7 -4 l0 -8 z" fill="url(#fireGrad)"/>
      <text x="78" y="1" class="disp" font-size="14.5" font-weight="800" fill="#FAFAFA">1ST PRIZE <tspan class="mono" font-size="11" font-weight="400" fill="#9C9C9C">·  Huawei ICT Global, Shenzhen</tspan></text>
      <text x="900" y="1" text-anchor="end" font-size="13" letter-spacing="0.08em" fill="#FF6B00">2025</text>
      <g class="tick r1">
        <text x="912" y="1" font-size="10" letter-spacing="0.06em" fill="#FF6B00">✓ VERIFIED</text>
      </g>
    </g>
    <!-- Row 2 -->
    <g transform="translate(0,296)">
      <path d="M54 -4 l7 4 l0 8 l-7 4 l-7 -4 l0 -8 z" fill="url(#fireGrad)"/>
      <text x="78" y="1" class="disp" font-size="14.5" font-weight="800" fill="#FAFAFA">IEEE PUBLICATION <tspan class="mono" font-size="11" font-weight="400" fill="#9C9C9C">·  DataForge — AI Data-Warehouse Schema Generator</tspan></text>
      <text x="900" y="1" text-anchor="end" font-size="13" letter-spacing="0.08em" fill="#FF6B00">2025</text>
      <g class="tick r2">
        <text x="912" y="1" font-size="10" letter-spacing="0.06em" fill="#FF6B00">✓ VERIFIED</text>
      </g>
    </g>
    <!-- Row 3 -->
    <g transform="translate(0,330)">
      <path d="M54 -4 l7 4 l0 8 l-7 4 l-7 -4 l0 -8 z" fill="url(#fireGrad)"/>
      <text x="78" y="1" class="disp" font-size="14.5" font-weight="800" fill="#FAFAFA">TOP 50 CODERS IN THE ARAB WORLD <tspan class="mono" font-size="11" font-weight="400" fill="#9C9C9C">·  Dubai Future Foundation</tspan></text>
      <text x="900" y="1" text-anchor="end" font-size="13" letter-spacing="0.08em" fill="#FF6B00">2022</text>
      <g class="tick r3">
        <text x="912" y="1" font-size="10" letter-spacing="0.06em" fill="#FF6B00">✓ VERIFIED</text>
      </g>
    </g>
    <!-- Row 4 -->
    <g transform="translate(0,364)">
      <path d="M54 -4 l7 4 l0 8 l-7 4 l-7 -4 l0 -8 z" fill="url(#fireGrad)"/>
      <text x="78" y="1" class="disp" font-size="14.5" font-weight="800" fill="#FAFAFA">REPRESENTED EGYPT AT MWC BARCELONA <tspan class="mono" font-size="11" font-weight="400" fill="#9C9C9C">·  GSMA</tspan></text>
      <text x="900" y="1" text-anchor="end" font-size="13" letter-spacing="0.08em" fill="#FF6B00">2023</text>
      <g class="tick r4">
        <text x="912" y="1" font-size="10" letter-spacing="0.06em" fill="#FF6B00">✓ VERIFIED</text>
      </g>
    </g>
    <!-- Row 5 -->
    <g transform="translate(0,398)">
      <path d="M54 -4 l7 4 l0 8 l-7 4 l-7 -4 l0 -8 z" fill="url(#fireGrad)"/>
      <text x="78" y="1" class="disp" font-size="14.5" font-weight="800" fill="#FAFAFA">GRADUATED WITH HONOURS <tspan class="mono" font-size="11" font-weight="400" fill="#9C9C9C">·  FCIS, Ain Shams — Project A+</tspan></text>
      <text x="900" y="1" text-anchor="end" font-size="13" letter-spacing="0.08em" fill="#FF6B00">2024</text>
      <g class="tick r5">
        <text x="912" y="1" font-size="10" letter-spacing="0.06em" fill="#FF6B00">✓ VERIFIED</text>
      </g>
    </g>
  </g>

  <!-- Faint horizontal scan line sweeping down the list -->
  <rect x="42" y="212" width="916" height="2" fill="url(#scanGrad)">
    <animate attributeName="y" values="212;404;212" dur="5.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.45;0.55;1" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline foot -->
  <text x="958" y="188" text-anchor="end" class="mono" font-size="9.5" letter-spacing="0.18em" fill="#5C6670">FORGING THE HEXTECH WORLD</text>
</svg>
